<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Encuesta de Salud</h1>

        <form id="formulario">

            <!-- Nombre -->
            <label>Nombre completo:</label>
            <input type="text" required>

            <!-- Edad -->
            <label>Edad:</label>
            <input type="number" min="1" max="120" required>

            <!-- Peso -->
            <label>Peso (kg):</label>
            <input type="number" min="20" max="250" required>

            <!-- Nivel de dolor -->
            <label>Nivel de dolor:</label>
            <input type="range" min="0" max="10" value="5" id="dolor">
            <p>Nivel seleccionado: <span id="valorDolor">5</span></p>

            <!-- Tipo de sangre -->
            <label>Tipo de sangre:</label>
            <select required>
                <option value="">Selecciona una opción</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <!-- Código Postal -->
            <label>Código Postal:</label>
            <input 
                type="text"
                pattern="[0-9]{5}"
                maxlength="5"
                placeholder="Ejemplo: 12345"
                required
            >

            <button type="submit">Enviar</button>

        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
