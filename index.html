<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Encuesta de Salud</h1>

        <form id="formulario">

            <!-- Nombre -->
            <label for="nombre">Nombre completo:</label>
            <input 
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
                required
            >

            <!-- Edad -->
            <label for="edad">Edad:</label>
            <input 
                type="number"
                id="edad"
                min="1"
                max="120"
                placeholder="Ingresa tu edad"
                required
            >

            <!-- Peso -->
            <label for="peso">Peso (kg):</label>
            <input 
                type="number"
                id="peso"
                min="20"
                max="250"
                placeholder="Ingresa tu peso"
                required
            >

            <!-- Nivel de dolor -->
            <label for="dolor">Nivel de dolor:</label>
            <input 
                type="range"
                id="dolor"
                min="0"
                max="10"
                value="5"
            >

            <p>
                Nivel seleccionado:
                <span id="valorDolor">5</span>
            </p>

            <!-- Tipo de sangre -->
            <label for="sangre">Tipo de sangre:</label>

            <select id="sangre" required>
                <option value="">Selecciona una opción</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <!-- Código Postal -->
            <label for="cp">Código Postal:</label>

            <input 
                type="text"
                id="cp"
                pattern="[0-9]{5}"
                maxlength="5"
                placeholder="Ejemplo: 12345"
                required
            >

            <!-- Botón -->
            <button type="submit">Enviar</button>

        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
